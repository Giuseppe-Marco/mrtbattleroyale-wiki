site_name: MRTBattleRoyale Wiki
site_description: The complete guide to MRTBattleRoyale, a Battle Royale minigame plugin for Paper.
site_author: MRT
# Change this after creating the GitHub repository:
#   https://<your-github-name>.github.io/<repository-name>/
site_url: https://giuseppe-marco.github.io/mrtbattleroyale-wiki/
copyright: Copyright &copy; MRT - MRTBattleRoyale

theme:
  name: material
  language: en
  # To use your own logo: put logo.png in docs/assets/ and replace the icon
  # block below with:  logo: assets/logo.png  and  favicon: assets/logo.png
  icon:
    logo: material/sword-cross
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: simple/modrinth
      link: https://modrinth.com/plugin/mrtbattleroyale
      name: MRTBattleRoyale on Modrinth

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first arena: getting-started/first-arena.md
      - Configuration files: getting-started/configuration.md
      - Per-arena settings: getting-started/arena-settings.md
  - Gameplay:
      - How a match works: gameplay/match.md
      - Loot, chests & airdrops: gameplay/loot.md
      - Zone: gameplay/zone.md
      - Gulag: gameplay/gulag.md
      - Teams, knockdown & colours: gameplay/teams.md
      - Spectators: gameplay/spectators.md
      - Spawn picker (map wall): gameplay/map-wall.md
  - Events: events.md
  - Server features:
      - Hub, NPCs & signs: features/hub.md
      - Chat: features/chat.md
      - Scoreboard: features/scoreboard.md
      - Stats, levels & shop: features/progression.md
  - Reference:
      - Commands: reference/commands.md
      - Permissions: reference/permissions.md
      - Placeholders: reference/placeholders.md
      - Admin tools: reference/admin-tools.md
      - Developer API: reference/api.md
  - FAQ: faq.md
  - Changelog: changelog.md
